experiment:
  name: smoke_synthetic
  output_dir: outputs
  seed: 42
  device: cuda
  amp: true
  deterministic: false
dataset:
  name: cityscapes
  root: data/synthetic_cityscapes
  classes:
  - road
  - sidewalk
  - building
  - wall
  - fence
  - pole
  - traffic light
  - traffic sign
  - vegetation
  - terrain
  - sky
  - person
  - rider
  - car
  - truck
  - bus
  - train
  - motorcycle
  - bicycle
  palette:
  - - 128
    - 64
    - 128
  - - 244
    - 35
    - 232
  - - 70
    - 70
    - 70
  - - 102
    - 102
    - 156
  - - 190
    - 153
    - 153
  - - 153
    - 153
    - 153
  - - 250
    - 170
    - 30
  - - 220
    - 220
    - 0
  - - 107
    - 142
    - 35
  - - 152
    - 251
    - 152
  - - 70
    - 130
    - 180
  - - 220
    - 20
    - 60
  - - 255
    - 0
    - 0
  - - 0
    - 0
    - 142
  - - 0
    - 0
    - 70
  - - 0
    - 60
    - 100
  - - 0
    - 80
    - 100
  - - 0
    - 0
    - 230
  - - 119
    - 11
    - 32
  ignore_index: 255
  source:
    mode: glob
    image_glob: leftImg8bit/{split}/*/*_leftImg8bit.png
    label_from_image:
    - - leftImg8bit/
      - gtFine/
    - - _leftImg8bit.png
      - _gtFine_labelIds.png
    label_glob: null
    list_file: null
    domain_regex: leftImg8bit/[^/]+/([^/]+)/
  label_map:
    7: 0
    8: 1
    11: 2
    12: 3
    13: 4
    17: 5
    19: 6
    20: 7
    21: 8
    22: 9
    23: 10
    24: 11
    25: 12
    26: 13
    27: 14
    28: 15
    31: 16
    32: 17
    33: 18
  reduce_zero_label: false
splits:
  train:
    split: train
    domains: all
  val:
    from: train
    fraction: 0.25
    per_domain: true
  test:
    split: val
    domains: all
  max_samples:
    train: null
    val: null
    test: null
transforms:
  train:
  - name: RandomScale
    scale:
    - 0.75
    - 1.25
  - name: RandomCrop
    size:
    - 128
    - 128
  - name: HorizontalFlip
    p: 0.5
  - name: ColorJitter
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    p: 0.5
  - name: Normalize
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
  val:
  - name: Resize
    size:
    - 128
    - 256
  - name: Normalize
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
  test:
  - name: Resize
    size:
    - 128
    - 256
  - name: Normalize
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
continual:
  enabled: true
  tasks:
  - - aachen
    - bochum
  - - bremen
    - cologne
  - - darmstadt
    - dusseldorf
  group_size: 1
  order: sorted
  num_tasks: null
  valid_set: task
  task_overrides: {}
model:
  name: drift
  embed_dim: 256
  shift_dim: 64
  modules:
    lora: true
    cosine_head: true
    anchors: true
    memory: true
    shift_estimator: true
    shift_library: true
    learnable_base: false
  encoder:
    name: simple_cnn
    pretrained: null
    freeze: false
  lora:
    rank: 8
    alpha: 16
    dropout: 0.0
    targets:
    - query
    - key
    - value
  decoder:
    dropout: 0.1
  shift_estimator:
    hidden: 256
    use_std: true
    detach_input: false
  prototypes:
    anchors:
      source: random
      file: null
      clip_model: openai/clip-vit-base-patch32
      template: a photo of a {} in a city street
    memory:
      num_slots: 1
      momentum: 0.0
    shift_library:
      num_bases: 8
  head:
    tau: 0.07
    learnable_tau: false
  inference:
    unknown_threshold: null
    merge_lora: true
loss:
  masked_softmax: true
  ce:
    weight: 1.0
    class_weights: null
    label_smoothing: 0.0
  dice:
    enabled: true
    weight: 0.5
  hidden:
    enabled: true
    weight: 0.5
    num_hidden: 2
    prob: 0.5
    detach_features: true
    require_memory: true
train:
  epochs: 3
  batch_size: 4
  num_workers: 0
  accum_steps: 1
  max_iters_per_epoch: null
  grad_clip: 1.0
  reset_optimizer_per_task: true
  optimizer:
    name: adamw
    lr: 0.001
    weight_decay: 0.01
    momentum: 0.9
    lr_mult:
      lora: 1.0
      decoder: 1.0
      shift_estimator: 1.0
      prototypes: 1.0
      head: 1.0
      encoder: 0.1
  scheduler:
    name: poly
    power: 0.9
    warmup_iters: 5
    step_size: 10
    gamma: 0.1
  log_interval: 0
eval:
  batch_size: 4
  num_workers: 0
  every: 1
  val_on: current
  track_seen_every_epoch: true
  test_after_each_task: true
  boundary_dilation: 0.02
  print_class_table: false
viz:
  num_samples: 4
  dpi: 120
  tsne:
    enabled: true
    max_images: 8
    pixels_per_image: 100
    max_points: 1500
    perplexity: 30
eda:
  max_images: null
  image_stats_max: 300
  spatial_res:
  - 64
  - 128
  num_sample_grid: 4
